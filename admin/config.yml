backend:
  name: git-gateway
  branch: main

# This makes /admin edit content/content.json, which the site loads at runtime.
media_folder: "images"
public_folder: "/images"

collections:
  - name: "site"
    label: "Site Content"
    files:
      - file: "content/content.json"
        label: "Homepage"
        name: "homepage"
         fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow text", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "Subheading", name: "subtitle", widget: "text" }
              - { label: "Button text", name: "ctaText", widget: "string" }
              - { label: "Button link", name: "ctaLink", widget: "string" }

          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body text", name: "text", widget: "text" }
              - label: "Stats"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "Number", name: "number", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }

          - label: "Process steps"
            name: "process"
            widget: "list"
            fields:
              - { label: "Step name", name: "step", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Author", name: "author", widget: "string" }

          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body text", name: "text", widget: "text" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Address", name: "address", widget: "string" }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Footer text", name: "text", widget: "string" }
